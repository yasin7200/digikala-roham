{% extends "base.html" %}

{% block title %}
Profile Information | Ana Hotel
{% endblock %}


{% block content %}

<section class="profile-form-section">

    <div class="profile-form-card">

        <h1>Complete Your Profile</h1>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}


            <div class="form-group">

                <label for="image">
                    Profile Image
                </label>

                <input 
                    type="file"
                    id="image"
                    name="image"
                    accept="image/*">

            </div>


            <div class="form-group">

                <label for="address">
                    Address
                </label>

                <textarea
                    id="address"
                    name="address"
                    rows="4"
                    placeholder="Enter your address..."
                    required></textarea>

            </div>


            <button type="submit" class="profile-btn">
                Save Information
            </button>


        </form>

    </div>

</section>


{% endblock %}
